</table>

        <div class="card">
            <h2>
                Data Pelanggan
            </h2>
            <label>Nama Pelanggan</label>
            <input type="text" id="nama" placeholder="Masukkan Nama">

            <label>Total Pembayaran</label>
            <input type="text" id="Total" placeholder="Masukkan Total Pembayaran Anda">
            <button onclick="hitungTotal()">HITUNG TOTAL</button>
            <div id="hasil" class="card hasil"></div>
            <div id="Struk pembayaran"></div>
        </div>
